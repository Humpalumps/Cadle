<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cadle</title>
<link rel="stylesheet" href="/src/ui/ui.css" />
<!-- The loading screen's own assets. Preloaded from the HTML so the browser starts fetching them during
     parse, in parallel with the JS, instead of only once the module graph has resolved. The loading
     screen is the first thing on screen, so its assets are on the critical path and nothing else is. -->
<link rel="preload" as="image" href="/assets/intro/wall_plaster.jpg" crossorigin />
<link rel="preload" as="image" href="/assets/intro/wood_floor.jpg" crossorigin />
<link rel="preload" as="image" href="/assets/intro/rug_indigo.jpg" crossorigin />
<link rel="preload" as="image" href="/assets/intro/hoodie_knit.jpg" crossorigin />
<link rel="preload" as="image" href="/assets/intro/chair_leather.jpg" crossorigin />
<link rel="preload" as="image" href="/assets/intro/poster_crystal.jpg" crossorigin />
<link rel="preload" as="image" href="/assets/intro/poster_ruins.jpg" crossorigin />
<style>
/* Boot splash: deliberately EMPTY — just the ground colour, painted before any JS so the page is never
   white. The cinematic intro (src/ui/Intro.js) is the loading screen and it removes this on its first
   frame; anything drawn here would be a second, competing loading screen for that half second. */
#introcanvas{position:fixed;inset:0;width:100%;height:100%;z-index:50;display:block;pointer-events:none}
#splash{position:fixed;inset:0;z-index:99;background:radial-gradient(120% 90% at 50% 38%,#191233 0%,#0d0a1c 52%,#070510 100%)}
#splash.gone{opacity:0;pointer-events:none;transition:opacity .3s ease}
</style>
</head>
<body>
<div id="splash"></div>
<canvas id="game"></canvas>
<!-- The intro renders here, and this canvas is handed to a Web Worker (transferControlToOffscreen)
     so the game's world build cannot stall the loading screen. It sits over #game and is removed
     at hand-off. Sized/positioned to match the game canvas exactly. -->
<canvas id="introcanvas"></canvas>
<div id="ui"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
