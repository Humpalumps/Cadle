<!doctype html>
<!-- Dev-only rig inspector (batch-3b): like ../glbview.html but frames the camera from the
     SKINNED bounding box AFTER posing, so a mangled retarget that flings the body sideways is
     still fully in frame and judgeable. Also picks the clip by NAME.
     Usage: /tools/out/assetgen/npcs/rigview.html?m=fisherman-animated&clip=walk&t=0.4
     m is relative to this dir (use ../../../../public/assets/creatures/<n> for staged files). -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#d8dae0;overflow:hidden}</style></head>
<body><script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const q = new URLSearchParams(location.search);
const name = q.get('m') || 'fisherman-animated';
const W = +(q.get('w') || 640), H = +(q.get('h') || 640);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd8dae0);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const key = new THREE.DirectionalLight(0xfff4e2, 2.6); key.position.set(4, 7, 5); key.castShadow = true;
scene.add(key, new THREE.HemisphereLight(0xffffff, 0x9aa0aa, 0.7));
const camera = new THREE.PerspectiveCamera(35, W / H, 0.01, 100);

new GLTFLoader().load(`./${name}.glb`, (gltf) => {
  const root = gltf.scene;
  root.traverse((o) => { if (o.isMesh) o.castShadow = o.receiveShadow = true; });
  scene.add(root);

  const clips = gltf.animations || [];
  const want = q.get('clip');
  const clip = clips.find((a) => a.name === want) || clips[0];
  if (clip) {
    const mixer = new THREE.AnimationMixer(root);
    mixer.clipAction(clip).play();
    mixer.update(+(q.get('t') || 0));
  }
  root.updateMatrixWorld(true);
  renderer.render(scene, camera);   // primes skeleton.boneMatrices, which getVertexPosition reads

  // frame from the SKINNED box of the current pose; trim 1% outliers per axis so one vertex
  // stretched by an unanimated joint cannot blow the framing up
  const pts = [[], [], []]; const v = new THREE.Vector3();
  root.traverse((o) => {
    if (!o.isSkinnedMesh) return;
    const pos = o.geometry.attributes.position;
    for (let i = 0; i < pos.count; i += 7) { o.getVertexPosition(i, v).applyMatrix4(o.matrixWorld); pts[0].push(v.x); pts[1].push(v.y); pts[2].push(v.z); }
  });
  const box = new THREE.Box3();
  if (pts[0].length) {
    for (const ax of [0, 1, 2]) pts[ax].sort((a, b) => a - b);
    const n = pts[0].length, lo = Math.floor(n * 0.01), hi = Math.ceil(n * 0.99) - 1;
    box.min.set(pts[0][lo], pts[1][lo], pts[2][lo]); box.max.set(pts[0][hi], pts[1][hi], pts[2][hi]);
  } else box.setFromObject(root);
  window.__box = { min: box.min.toArray(), max: box.max.toArray(), samples: pts[0].length };
  const size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
  const r = Math.max(size.x, size.y, size.z) * 0.5;
  const yaw = +(q.get('yaw') || 35) * Math.PI / 180, pitch = +(q.get('pitch') || 10) * Math.PI / 180;
  const d = r / Math.tan(camera.fov * Math.PI / 360) * 1.25;
  camera.position.set(c.x + Math.sin(yaw) * Math.cos(pitch) * d, c.y + Math.sin(pitch) * d, c.z + Math.cos(yaw) * Math.cos(pitch) * d);
  camera.lookAt(c);
  key.target.position.copy(c); scene.add(key.target);

  const ground = new THREE.Mesh(new THREE.PlaneGeometry(r * 20, r * 20), new THREE.ShadowMaterial({ opacity: 0.22 }));
  ground.rotation.x = -Math.PI / 2; ground.position.y = box.min.y; ground.receiveShadow = true;
  scene.add(ground);

  renderer.render(scene, camera);
  document.title = `${name} clip=${clip?.name ?? 'none'} of [${clips.map((a) => a.name).join(',')}]`;
  window.__ready = true;
}, undefined, (e) => { document.title = 'ERR ' + e; window.__ready = 'error'; });
</script></body></html>
