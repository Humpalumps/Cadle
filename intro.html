<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Cadle — intro stage preview</title>
<style>html,body{margin:0;height:100%;background:#04050a;overflow:hidden}canvas{display:block;width:100%;height:100%}
#hud{position:fixed;left:10px;top:8px;font:12px ui-monospace,monospace;color:#9d8cff;opacity:.75;white-space:pre}</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<script type="module">
// Standalone preview of the intro stage (src/ui/intro/*). Not shipped to players — it exists so the
// room / character / stage can be iterated on with tools/inspect.mjs without booting the whole game.
//   ?noroom=1  ?nochar=1  ?seed=N
//   __intro.orbit(rad)  __intro.suck(k)  __intro.boost(x)  __intro.cam(x,y,z)  __intro.fit()
import * as THREE from 'three';
import { EffectComposer, RenderPass, EffectPass, BloomEffect, VignetteEffect, ToneMappingEffect, ToneMappingMode, SMAAEffect } from 'postprocessing';
import { buildStage } from './src/ui/intro/stage.js';

const q = new URLSearchParams(location.search);
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance', stencil: false, alpha: false });
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const stage = await buildStage({
  seed: +(q.get('seed') || 7),
  withRoom: q.get('noroom') !== '1',
  withCharacter: q.get('nochar') !== '1',
});
stage.camera.aspect = innerWidth / innerHeight; stage.camera.updateProjectionMatrix();

// placeholder "game on the monitor" so the screen is not blank while iterating
const cv = document.createElement('canvas'); cv.width = 1024; cv.height = 576;
{
  const x = cv.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, 576);
  g.addColorStop(0, '#2a3f86'); g.addColorStop(0.55, '#6b74b8'); g.addColorStop(0.56, '#2c4a2c'); g.addColorStop(1, '#16301a');
  x.fillStyle = g; x.fillRect(0, 0, 1024, 576);
  x.fillStyle = 'rgba(255,240,200,.9)'; x.beginPath(); x.arc(760, 150, 46, 0, 7); x.fill();
  x.fillStyle = '#d3a548'; x.font = '600 40px Georgia'; x.textAlign = 'center'; x.fillText('CADLE', 512, 300);
}
const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
stage.setScreenTexture(tex);

const composer = new EffectComposer(renderer, { frameBufferType: THREE.HalfFloatType });
composer.addPass(new RenderPass(stage.scene, stage.camera));
composer.addPass(new EffectPass(stage.camera,
  new BloomEffect({ luminanceThreshold: 0.72, luminanceSmoothing: 0.3, intensity: 1.15, mipmapBlur: true, radius: 0.72 }),
  new VignetteEffect({ offset: 0.32, darkness: 0.5 }),
  new ToneMappingEffect({ mode: ToneMappingMode.ACES_FILMIC }),
  new SMAAEffect(),
));

addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight, false); composer.setSize(innerWidth, innerHeight);
  stage.camera.aspect = innerWidth / innerHeight; stage.camera.updateProjectionMatrix();
});

const hud = document.getElementById('hud');
let t = 0, last = performance.now(), fr = 0, acc = 0;
function loop() {
  requestAnimationFrame(loop);
  const now = performance.now(), dt = Math.min((now - last) / 1000, 0.05); last = now; t += dt;
  stage.update(t, dt);
  composer.render(dt);
  if (++fr % 20 === 0) {
    acc = renderer.info.render.triangles;
    hud.textContent = `build ${stage.buildMs.toFixed(0)} ms   tris ${acc}   calls ${renderer.info.render.calls}`;
  }
}
loop();

window.__intro = {
  stage,
  orbit: (d) => {   // works whether the camera is on its own path or parked by cam()
    const c = stage.camera, tx = 0, ty = 1.06, tz = -0.7;
    const dx = c.position.x - tx, dz = c.position.z - tz;
    const r = Math.hypot(dx, dz), a = Math.atan2(dx, dz) + d;
    c.position.x = tx + Math.sin(a) * r; c.position.z = tz + Math.cos(a) * r;
    c.lookAt(tx, ty, tz);
    stage.setCameraFree(true);
  },
  suck: (k) => stage.setSuck(k),
  boost: (x) => stage.setScreenBoost(x),
  cam: (x, y, z) => { stage.setCameraFree(true); stage.camera.position.set(x, y, z); stage.camera.lookAt(0, 1.06, -0.7); },
  fit: () => { const f = stage.fitCameraToScreen(innerWidth / innerHeight); stage.setCameraFree(true); stage.camera.position.copy(f.pos); stage.camera.lookAt(f.look); },
  free: (v = true) => stage.setCameraFree(v),
};
// tools/inspect.mjs waits for a running window.__game before it runs its steps — give it one so the
// preview page works with the normal harness instead of eating its 60 s timeout.
window.__game = {
  errors: [], game: { _running: true },
  state: () => ({ preview: 'intro', suck: 0 }), stats: () => ({}), resetStats() {},
  input: { press() {}, release() {}, move() {}, button() {} },
};
console.log('[intro-preview] build', stage.buildMs.toFixed(1), 'ms');
</script>
</body>
</html>
